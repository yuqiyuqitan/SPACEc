[metadata]
description = SPatial Analysis for CodEX data (SPACEc)
name = SPACEc
author = yuqiyuqitan
author_email = tanyuqi527@gmail.com
license = Stanford Academic Software License (non-commercial)
license_files = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/yuqiyuqitan/SPACEc
# Add here related links, for example:
project_urls =
    Documentation = https://spacec.readthedocs.io/
    Source = https://github.com/yuqiyuqitan/SPACEc
#    Changelog = https://pyscaffold.org/en/latest/changelog.html
    Tracker = https://github.com/yuqiyuqitan/SPACEc/issues
#    Conda-Forge = https://anaconda.org/conda-forge/pyscaffold
#    Download = https://pypi.org/project/PyScaffold/#files
#    Twitter = https://twitter.com/PyScaffold

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any

# Add here all kinds of additional classifiers as defined under
# https://pypi.org/classifiers/
classifiers =
    Development Status :: 4 - Beta
    Programming Language :: Python
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: Other/Proprietary License


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =src

# Add here links from where the project can find additional dependencies
# e.g. links to your internal index, to a specific repository or to a specific
# version control commit.
# dependency_links =

# Require a min/specific Python version (comma-separated conditions)
# 3.10 floor: pygraphviz>=2.0 (which supplies the bundled Graphviz libraries,
# see below) publishes no wheels for 3.9, and 3.9 reached end of life in
# October 2025.
python_requires = >=3.10,<3.13

# Add here dependencies of your project (line-separated), e.g. requests>=2.2,<3.0.
# Version specifiers like >=2.2,<3.0 avoid problems due to API changes in
# new major versions. This works if the required packages follow Semantic Versioning.
# For more information, check out https://semver.org/.
install_requires =
    tqdm
    # Used to download the TissUUmaps plugins, see tools/_general.py.
    # Previously only present by accident, via the conda environment.
    requests
    joblib
    # pandas 3.0 makes `str` (pd.arrays.StringArray) the default string dtype.
    # anndata refuses to write StringArray by default, so `write_h5ad` fails on
    # `obs`'s index; the scanpy/anndata stack is not yet tested against pandas 3.
    pandas<3
    statsmodels
    scikit-learn
    scikit-image
    # TODO: remove version when we find the bug (what bug?)
    # scanpy==1.9.6
    scanpy
    # pynndescent 0.7 returns scipy sparse *arrays*; scanpy<1.12 calls .getnnz() on
    # them and crashes in sc.pp.neighbors (>~10k cells). scanpy>=1.12 fixes it but
    # needs numpy>=2, which pyFlowSOM (numpy<2) blocks. Drop when both allow it.
    pynndescent<0.7
    networkx
    tensorly
    # Supports both classic cellpose 3.x ('cyto3') and cellpose>=4 Cellpose-SAM
    # ('cpsam'); see docs/cellpose_models.md and sp.hf.set_cellpose_version().
    # cellpose>=4 pulls in segment_anything and torchvision as transitive deps.
    cellpose>=3.0,<5
    # TODO: if we don't restrict this, we get a segmentation fault in `test_04_clustering.py` for MACOS arm64
    torch<2.6
    concave_hull
    pyFlowSOM>=0.1.16
    ipython<8.25
    ipywidgets
    ipyfilechooser
    jupyter
    TissUUmaps
    # MAYBE NOT NEEDED? Can't find reference
    # but might help with some downstream dependencies
    Flask==2.0.0
    # TODO: Double check why we need this version and mention it here.
    Werkzeug==2.3.8
    # MAYBE NOT NEEDED? As it seems to be an outdated dependency
    # as igraph should be used according to PyPi:
    # https://pypi.org/project/python-igraph/
    # python-igraph
    # TODO: Do we need this particular version? If yes, why?
    # igraph==0.9.10
    igraph
    # CAN WE REMOVE THE SYSTEM SPECS NOW?
    leidenalg
    # MAYBE NOT NEEDED? Super old version ... is `louvain` enough?
    python-louvain==0.1
    matplotlib==3.9
    networkx<3.4
    # The three entries below replace what used to be a mandatory
    # `conda install -c conda-forge graphviz libvips openslide` step. Each pulls
    # the native library in from a wheel, so keep the extra/`-bin`/version floor:
    # dropping them silently reintroduces the conda-only requirement.
    #
    # `[binary]` pulls in pyvips-binary, which ships `_libvips` + libvips.so.
    # Plain `pyvips` falls back to dlopen()ing a system libvips.
    # Needed by TissUUmaps, which SPACEc imports at module scope.
    # Caveat: pyvips is published as an sdist only, so pip compiles it. If a
    # *different* libvips is visible to pkg-config at build time (a leftover
    # conda or Homebrew one), pip builds the `_libvips` wrapper against those
    # headers while pyvips-binary supplies a different libvips at runtime.
    # pyvips then rejects API mode and falls back to ABI mode, failing with
    # "cannot load library libvips.42". Fix is to rebuild without the stray
    # libvips visible -- see the troubleshooting note in README.md.
    pyvips[binary]
    # openslide-python loads `openslide_bin` if importable, else a system
    # libopenslide. Also a TissUUmaps dependency.
    openslide-python
    openslide-bin
    # >=2.0 is the first release whose wheels bundle libgvc/libcgraph and run
    # layouts in-process; earlier versions shell out to the `dot` binary.
    pygraphviz>=2.0
    geopandas
    shapely
    descartes


[options.packages.find]
where = src
exclude =
    tests

[options.package_data]
# Listed explicitly: include_package_data only picks these up via
# setuptools_scm's git file finder, so builds without .git dropped them.
spacec = plotting/styles/*.mplstyle


[options.extras_require]
# Add here additional requirements for extra features, to install with:
# `pip install spacec[PDF]` like:
# PDF = ReportLab; RXP
# GPU-accelerated clustering. rapids-singlecell ships one distribution per CUDA
# major version and pulls the RAPIDS stack through its own `rapids` extra, so
# pick the one matching `torch.version.cuda`. Both need
# `--extra-index-url=https://pypi.nvidia.com`. Optional -- these are large.
rapids12 =
    rapids-singlecell-cu12[rapids]
rapids13 =
    rapids-singlecell-cu13[rapids]
# torch-scatter/torch-sparse need `-f https://data.pyg.org/whl/torch-<ver>+<cpu|cuXXX>.html`
# (matching the installed torch build) and are not resolvable from PyPI alone. STELLAR
# itself is not on PyPI -- install it with
# `pip install git+https://github.com/TKempchen/stellar-py3.12` (PyPI forbids direct-URL
# dependencies in a published extra). See README.md or run `sp.tl.install_stellar()`.
stellar =
    torch-geometric>=2.4
# Legacy louvain backend (`flavor="legacy"` with `clustering="louvain"`, and
# STELLAR's `louvain_flavor="vtraag"`). `louvain` is deprecated: 0.8.2 is its last
# release, needs igraph<0.12 (so leidenalg<0.12, as leidenalg 0.12 needs igraph>=1.0),
# has wheels only up to Python 3.11, and imports `pkg_resources` at runtime, which
# setuptools>=81 no longer ships. Without these pins pip backtracks to the
# sdist-only louvain 0.7.1, which needs CMake and a C++ compiler to build.
legacy =
    louvain==0.8.2
    igraph>=0.10,<0.12
    leidenalg<0.12
    setuptools<81

# Add here test requirements (semicolon/line-separated)
testing =
    setuptools
    pytest
    pytest-cov
    # disabling extra tests since I can't make them work on Github Actions
    # torch @ https://download.pytorch.org/whl/cpu/torch-2.3.0%%2Bcpu-cp39-cp39-linux_x86_64.whl ; sys_platform == 'linux'
    # torch @ https://download.pytorch.org/whl/cpu/torch-2.3.0%%2Bcpu-cp38-cp38-win_amd64.whl ; sys_platform == 'win32'
    # torch_geometric
    # torch_sparse
    # pyg-lib @ https://data.pyg.org/whl/torch-2.3.0%%2Bcpu/pyg_lib-0.4.0%%2Bpt23cpu-cp39-cp39-linux_x86_64.whl ; sys_platform == 'linux'
    # pyg-lib @ https://data.pyg.org/whl/torch-2.3.0%%2Bcpu/pyg_lib-0.4.0%%2Bpt23cpu-cp39-cp39-win_amd64.whl ; sys_platform == 'win32'

[options.entry_points]
# Add here console scripts like:
# console_scripts =
#     script_name = spacec.module:function
# For example:
# console_scripts =
#     fibonacci = spacec.skeleton:run
# And any other entry points, for example:
# pyscaffold.cli =
#     awesome = pyscaffoldext.awesome.extension:AwesomeExtension

[tool:pytest]
# Specify command line options as you would do when invoking pytest directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
# CAUTION: --cov flags may prohibit setting breakpoints while debugging.
#          Comment those flags to avoid this pytest issue.
addopts =
    --cov spacec --cov-report term-missing
    --verbose
    -m "not slow and not skip and not gpu"
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# Use pytest markers to select/deselect specific tests
markers =
    slow: mark tests as slow (run with '-m slow')
    skip: mark tests to be skipped (run with '-m skip')
    gpu:  mark tests that require GPUs (run with '-m gpu')
#     system: mark end-to-end system tests

[devpi:upload]
# Options for the devpi: PyPI server and packaging tool
# VCS export must be deactivated since we are using setuptools-scm
no_vcs = 1
formats = bdist_wheel

[flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore = E203, W503
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py

[pyscaffold]
# PyScaffold's parameters when the project was created.
# This will be used when updating. Do not change!
version = 4.5
package = spacec
extensions =
    github_actions
    markdown
    pre_commit
